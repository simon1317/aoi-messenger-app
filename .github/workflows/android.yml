name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AOI-쪽지.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: aoi-apk
          path: AOI-쪽지.apk
          if-no-files-found: error

      - name: Publish to Release (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AOI 쪽지 최신 APK
          body: "최신 빌드. AOI-쪽지.apk 를 폰에서 받아 설치하세요."
          files: AOI-쪽지.apk
